name: Build Android TV & Mobile APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build APK with Gradle
      run: |
        cd android
        gradle assembleDebug --stacktrace
        mkdir -p ../dist-apk
        cp app/build/outputs/apk/debug/app-debug.apk ../dist-apk/Kinoma-TV-release.apk
        cp app/build/outputs/apk/debug/app-debug.apk ../dist-apk/Kinoma-Mobile-release.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Kinoma-APKs
        path: dist-apk/*.apk

    - name: Create or Update GitHub Release
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest-build
        name: Kinoma TV & Mobile Latest Build
        body: |
          Official Android builds for Kinoma:
          - **Kinoma-TV-release.apk**: Optimized for Android TV & Google TV (Leanback D-pad controls)
          - **Kinoma-Mobile-release.apk**: Optimized for Android Phones & Tablets
        files: |
          dist-apk/Kinoma-TV-release.apk
          dist-apk/Kinoma-Mobile-release.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
