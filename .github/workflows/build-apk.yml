name: Build & Release Android TV APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build Kinoma Android TV APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Install web dependencies
      - name: Install web dependencies
        shell: bash
        run: |
          set -e
          if [ -f "package-lock.json" ]; then
            npm ci
          elif [ -f "yarn.lock" ]; then
            corepack enable
            yarn install --frozen-lockfile
          else
            npm install
          fi

      # 4. Build PWA
      - name: Build web application
        run: npm run build

      # 5. Setup Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 6. Configure Android SDK
      - name: Configure Android SDK
        shell: bash
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      # 7. Install Android SDK packages
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      # 8. Decode Keystore (Release only)
      - name: Decode Keystore
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KINOMA_KEYSTORE_BASE64: ${{ secrets.KINOMA_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KINOMA_KEYSTORE_BASE64" ]; then
            echo "ERROR: KINOMA_KEYSTORE_BASE64 secret is missing. Release build will not be signed correctly."
            exit 1
          fi
          mkdir -p android/app/build
          echo "$KINOMA_KEYSTORE_BASE64" | base64 --decode > android/app/build/release.keystore

      # 9. Build Android APK
      - name: Build Android APK
        working-directory: android
        env:
          KINOMA_KEYSTORE_BASE64: ${{ secrets.KINOMA_KEYSTORE_BASE64 }}
          KINOMA_KEYSTORE_PASSWORD: ${{ secrets.KINOMA_KEYSTORE_PASSWORD }}
          KINOMA_KEY_ALIAS: ${{ secrets.KINOMA_KEY_ALIAS }}
          KINOMA_KEY_PASSWORD: ${{ secrets.KINOMA_KEY_PASSWORD }}
        run: |
          if [ ! -f "./gradlew" ]; then
            sudo apt-get update && sudo apt-get install -y gradle
            gradle wrapper --gradle-version 8.5
          fi
          chmod +x ./gradlew
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            ./gradlew assembleRelease --stacktrace
          else
            ./gradlew assembleDebug --stacktrace
          fi

      # 10. Prepare Final APK and SHA-256 (Release only)
      - name: Prepare Release Assets
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p dist-release
          APK_PATH=$(find android/app/build/outputs/apk/release -type f -name "*.apk" | head -1)
          cp "$APK_PATH" dist-release/Kinoma.apk
          sha256sum dist-release/Kinoma.apk | cut -d ' ' -f 1 > dist-release/Kinoma.apk.sha256
          echo "SHA256=$(cat dist-release/Kinoma.apk.sha256)" >> $GITHUB_ENV
          echo "APK_VERSION_NAME=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV
          echo "APK_VERSION_CODE=$(grep 'versionCode' android/app/build.gradle | head -1 | awk '{print $2}')" >> $GITHUB_ENV

      # 11. Create GitHub Release (Release only)
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-release/Kinoma.apk
          generate_release_notes: true
          name: Kinoma TV v${{ env.APK_VERSION_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 12. Update latest.json (Release only)
      - name: Update latest.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          JSON_CONTENT=$(cat <<EOF
          {
            "versionCode": ${{ env.APK_VERSION_CODE }},
            "versionName": "${{ env.APK_VERSION_NAME }}",
            "apkUrl": "https://github.com/titan717/Kinoma/releases/latest/download/Kinoma.apk",
            "releaseNotes": "Release v${{ env.APK_VERSION_NAME }}",
            "sha256": "${{ env.SHA256 }}",
            "mandatory": false
          }
          EOF
          )
          echo "$JSON_CONTENT" > update/latest.json
          
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add update/latest.json
          git commit -m "Update latest.json for v${{ env.APK_VERSION_NAME }}"
          git push origin main

      # 13. Upload Artifacts (Always)
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kinoma-Build-Artifacts
          path: |
            android/**/build/outputs/apk/**/*.apk
            dist-release/*.apk
          if-no-files-found: warn
          retention-days: 30
