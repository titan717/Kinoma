```yaml
name: Build and Release Kinoma Android TV APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build Android TV APK
    runs-on: ubuntu-latest

    steps:
      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------
      - name: Checkout Kinoma
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # Java 17
      # ----------------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ----------------------------------------------------------
      # Android SDK
      # ----------------------------------------------------------
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      # ----------------------------------------------------------
      # Install official Gradle 8.5
      #
      # IMPORTANT:
      # Do NOT use Ubuntu's apt Gradle 4.4.1.
      # ----------------------------------------------------------
      - name: Install Gradle 8.5
        shell: bash
        run: |
          set -e

          curl -L \
            -o /tmp/gradle.zip \
            https://services.gradle.org/distributions/gradle-8.5-bin.zip

          mkdir -p "$HOME/gradle"

          unzip -q \
            /tmp/gradle.zip \
            -d "$HOME/gradle"

          echo "$HOME/gradle/gradle-8.5/bin" >> "$GITHUB_PATH"

          "$HOME/gradle/gradle-8.5/bin/gradle" --version

      # ----------------------------------------------------------
      # Check Android project
      # ----------------------------------------------------------
      - name: Verify Android project
        working-directory: android
        run: |
          echo "Android project:"
          pwd
          echo ""

          ls -la

          echo ""
          echo "settings.gradle:"
          cat settings.gradle

      # ----------------------------------------------------------
      # Make sure Gradle wrapper exists
      # ----------------------------------------------------------
      - name: Ensure Gradle wrapper
        working-directory: android
        shell: bash
        run: |
          set -e

          if [ ! -f "./gradlew" ]; then
            echo "gradlew is missing."
            echo "Generating wrapper with official Gradle 8.5..."

            gradle wrapper \
              --gradle-version 8.5 \
              --distribution-type bin
          else
            echo "gradlew already exists."
          fi

          chmod +x ./gradlew

          echo ""
          echo "Wrapper:"
          ls -la ./gradlew

      # ----------------------------------------------------------
      # Force wrapper to Gradle 8.5
      # ----------------------------------------------------------
      - name: Configure Gradle wrapper
        working-directory: android
        shell: bash
        run: |
          set -e

          mkdir -p gradle/wrapper

          if [ -f "gradle/wrapper/gradle-wrapper.properties" ]; then
            sed -i \
              's#distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.5-bin.zip#' \
              gradle/wrapper/gradle-wrapper.properties
          else
            echo "ERROR: Gradle wrapper properties were not generated."
            exit 1
          fi

          echo ""
          cat gradle/wrapper/gradle-wrapper.properties

      # ----------------------------------------------------------
      # AndroidX
      # ----------------------------------------------------------
      - name: Configure AndroidX
        working-directory: android
        shell: bash
        run: |
          set -e

          touch gradle.properties

          if grep -q '^android.useAndroidX=' gradle.properties; then
            sed -i \
              's/^android.useAndroidX=.*/android.useAndroidX=true/' \
              gradle.properties
          else
            echo 'android.useAndroidX=true' >> gradle.properties
          fi

          if grep -q '^android.enableJetifier=' gradle.properties; then
            sed -i \
              's/^android.enableJetifier=.*/android.enableJetifier=true/' \
              gradle.properties
          else
            echo 'android.enableJetifier=true' >> gradle.properties
          fi

          if grep -q '^org.gradle.jvmargs=' gradle.properties; then
            sed -i \
              's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8/' \
              gradle.properties
          else
            echo 'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8' >> gradle.properties
          fi

          echo ""
          echo "gradle.properties:"
          cat gradle.properties

      # ----------------------------------------------------------
      # Verify actual Gradle version
      # ----------------------------------------------------------
      - name: Verify Gradle
        working-directory: android
        run: |
          java -version
          ./gradlew --version

      # ----------------------------------------------------------
      # Build
      # ----------------------------------------------------------
      - name: Build Android APK
        working-directory: android
        run: |
          ./gradlew clean assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      # ----------------------------------------------------------
      # Locate APK
      # ----------------------------------------------------------
      - name: Prepare APK
        shell: bash
        run: |
          set -e

          APK=$(find android/app/build/outputs/apk -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: No APK was generated."
            find android/app/build -type f | head -100
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          mkdir -p release

          cp "$APK" release/Kinoma-Android-TV.apk

          echo ""
          echo "Final APK:"
          ls -lh release/Kinoma-Android-TV.apk

      # ----------------------------------------------------------
      # GitHub Release
      # ----------------------------------------------------------
      - name: Publish APK Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kinoma-build-${{ github.run_number }}
          name: Kinoma Android TV Build ${{ github.run_number }}
          body: |
            # Kinoma Android TV

            Automatically generated Android TV APK.

            Download:
            `Kinoma-Android-TV.apk`
          files: release/Kinoma-Android-TV.apk
          generate_release_notes: false
```
