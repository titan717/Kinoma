name: Build Android TV APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Kinoma Android TV APK
    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------------
      # 1. Checkout
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # ------------------------------------------------------------
      # 2. Setup Node.js
      # ------------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20


      # ------------------------------------------------------------
      # 3. Install web dependencies
      # ------------------------------------------------------------
      - name: Install web dependencies
        shell: bash
        run: |
          set -e

          if [ -f "package-lock.json" ]; then
            npm ci

          elif [ -f "npm-shrinkwrap.json" ]; then
            npm ci

          elif [ -f "yarn.lock" ]; then
            corepack enable
            yarn install --frozen-lockfile

          elif [ -f "pnpm-lock.yaml" ]; then
            corepack enable
            pnpm install --frozen-lockfile

          else
            echo "No lock file found."
            npm install
          fi


      # ------------------------------------------------------------
      # 4. Build PWA
      # ------------------------------------------------------------
      - name: Build web application
        run: npm run build


      # ------------------------------------------------------------
      # 5. Setup Java
      # ------------------------------------------------------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17


      # ------------------------------------------------------------
      # 6. Configure Android SDK
      #
      # Do NOT use android-actions/setup-android@v3 here.
      # That action is attempting to install the obsolete
      # "tools" SDK package.
      # GitHub's ubuntu runner already provides the Android SDK.
      # ------------------------------------------------------------
      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          if [ -z "$ANDROID_HOME" ]; then
            export ANDROID_HOME="$ANDROID_SDK_ROOT"
          fi

          if [ -z "$ANDROID_HOME" ]; then
            export ANDROID_HOME="/usr/local/lib/android/sdk"
          fi

          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          echo "Using Android SDK:"
          echo "$ANDROID_HOME"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          echo ""
          echo "SDK manager:"
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
          elif command -v sdkmanager >/dev/null 2>&1; then
            sdkmanager --version
          else
            echo "ERROR: sdkmanager not found."
            exit 1
          fi


      # ------------------------------------------------------------
      # 7. Install required Android SDK packages
      # ------------------------------------------------------------
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          echo "Accepting Android SDK licenses..."

          yes | sdkmanager --licenses > /dev/null || true

          echo "Installing required SDK packages..."

          sdkmanager "platform-tools"
          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;34.0.0"

          echo ""
          echo "Installed Android SDK packages:"
          sdkmanager --list_installed | grep -E \
            "platform-tools|platforms;android-34|build-tools;34.0.0" || true


      # ------------------------------------------------------------
      # 8. Verify Android project
      # ------------------------------------------------------------
      - name: Verify Android project
        shell: bash
        run: |
          set -e

          if [ ! -d "android" ]; then
            echo "ERROR: android directory does not exist."
            exit 1
          fi

          echo "Android project found."

          echo ""
          echo "Top-level Android files:"
          find android -maxdepth 2 -type f | sort


      # ------------------------------------------------------------
      # 9. Prepare Gradle wrapper
      # ------------------------------------------------------------
      - name: Prepare Gradle wrapper
        working-directory: android
        shell: bash
        run: |
          set -e

          if [ -f "./gradlew" ]; then
            echo "Existing Gradle wrapper found."
            chmod +x ./gradlew
          else
            echo "Gradle wrapper is missing."
            echo "Generating wrapper..."

            if ! command -v gradle >/dev/null 2>&1; then
              echo "Installing Gradle..."
              sudo apt-get update
              sudo apt-get install -y gradle
            fi

            echo ""
            echo "System Gradle:"
            gradle --version

            GRADLE_VERSION=""

            if [ -f "gradle/wrapper/gradle-wrapper.properties" ]; then
              GRADLE_VERSION=$(grep -Eo \
                'gradle-[0-9]+\.[0-9]+(\.[0-9]+)?(-[A-Za-z0-9.-]+)?-(bin|all)\.zip' \
                gradle/wrapper/gradle-wrapper.properties \
                | head -1 \
                | sed -E 's/gradle-//; s/-(bin|all)\.zip$//' || true)
            fi

            if [ -n "$GRADLE_VERSION" ]; then
              echo "Using existing Gradle version: $GRADLE_VERSION"
              gradle wrapper --gradle-version "$GRADLE_VERSION"
            else
              echo "No existing wrapper version found."
              gradle wrapper
            fi

            chmod +x ./gradlew
          fi

          echo ""
          echo "Checking Gradle wrapper..."

          ls -la ./gradlew

          if [ ! -f "./gradlew" ]; then
            echo "ERROR: gradlew is still missing."
            exit 1
          fi


      # ------------------------------------------------------------
      # 10. Build Android TV APK
      # ------------------------------------------------------------
      - name: Build Android TV APK
        working-directory: android
        shell: bash
        run: |
          set -e

          chmod +x ./gradlew

          echo "Gradle version:"
          ./gradlew --version

          echo ""
          echo "Starting Android TV APK build..."

          ./gradlew assembleDebug --stacktrace


      # ------------------------------------------------------------
      # 11. Find APK
      # ------------------------------------------------------------
      - name: Find generated APK
        shell: bash
        run: |
          set -e

          echo "Searching for APK..."

          find android -type f -name "*.apk" -print

          APK_COUNT=$(find android -type f -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No APK was generated."
            exit 1
          fi

          echo ""
          echo "APK generated successfully."


      # ------------------------------------------------------------
      # 12. Upload APK
      # ------------------------------------------------------------
      - name: Upload Android TV APK
        uses: actions/upload-artifact@v4
        with:
          name: Kinoma-Android-TV-APK
          path: android/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
