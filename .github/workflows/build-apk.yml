name: Build Android TV APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Kinoma Android TV APK
    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------------
      # 1. Checkout repository
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # ------------------------------------------------------------
      # 2. Setup Node.js
      # ------------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20


      # ------------------------------------------------------------
      # 3. Install web dependencies
      # ------------------------------------------------------------
      - name: Install web dependencies
        shell: bash
        run: |
          set -e

          echo "Checking package manager files..."

          if [ -f "package-lock.json" ]; then
            echo "package-lock.json found"
            npm ci

          elif [ -f "npm-shrinkwrap.json" ]; then
            echo "npm-shrinkwrap.json found"
            npm ci

          elif [ -f "yarn.lock" ]; then
            echo "yarn.lock found"
            corepack enable
            yarn install --frozen-lockfile

          elif [ -f "pnpm-lock.yaml" ]; then
            echo "pnpm-lock.yaml found"
            corepack enable
            pnpm install --frozen-lockfile

          else
            echo "No lock file found."
            echo "Using npm install."
            npm install
          fi


      # ------------------------------------------------------------
      # 4. Build PWA
      # ------------------------------------------------------------
      - name: Build web application
        run: npm run build


      # ------------------------------------------------------------
      # 5. Setup Java
      # ------------------------------------------------------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17


      # ------------------------------------------------------------
      # 6. Setup Android SDK
      # ------------------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # ------------------------------------------------------------
      # 7. Install Android SDK packages
      # ------------------------------------------------------------
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses > /dev/null || true

          sdkmanager "platform-tools"
          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;34.0.0"


      # ------------------------------------------------------------
      # 8. Verify Android project
      # ------------------------------------------------------------
      - name: Verify Android project
        shell: bash
        run: |
          set -e

          if [ ! -d "android" ]; then
            echo "ERROR: android directory does not exist."
            exit 1
          fi

          echo "Android project found."

          echo ""
          echo "Android project files:"
          find android -maxdepth 3 -type f | sort


      # ------------------------------------------------------------
      # 9. Prepare Gradle
      # ------------------------------------------------------------
      - name: Prepare Gradle wrapper
        working-directory: android
        shell: bash
        run: |
          set -e

          if [ -f "./gradlew" ]; then
            echo "Existing Gradle wrapper found."
            chmod +x ./gradlew
            exit 0
          fi

          echo "Gradle wrapper is missing."
          echo "Attempting to generate it."

          # Install Gradle only if it isn't already available.
          if ! command -v gradle >/dev/null 2>&1; then
            echo "Installing Gradle..."
            sudo apt-get update
            sudo apt-get install -y gradle
          fi

          echo ""
          echo "Installed Gradle:"
          gradle --version

          # Try to preserve an existing wrapper version if available.
          GRADLE_VERSION=""

          if [ -f "gradle/wrapper/gradle-wrapper.properties" ]; then
            GRADLE_VERSION=$(grep -Eo \
              'gradle-[0-9]+\.[0-9]+(\.[0-9]+)?(-[A-Za-z0-9.-]+)?-(bin|all)\.zip' \
              gradle/wrapper/gradle-wrapper.properties \
              | head -1 \
              | sed -E 's/gradle-//; s/-(bin|all)\.zip$//' || true)
          fi

          if [ -n "$GRADLE_VERSION" ]; then
            echo "Using Gradle version: $GRADLE_VERSION"
            gradle wrapper --gradle-version "$GRADLE_VERSION"
          else
            echo "No existing wrapper version found."
            echo "Generating wrapper using installed Gradle."
            gradle wrapper
          fi

          chmod +x ./gradlew

          echo ""
          echo "Gradle wrapper generated successfully."

          ls -la ./gradlew

          if [ ! -f "./gradlew" ]; then
            echo "ERROR: gradlew was not generated."
            exit 1
          fi


      # ------------------------------------------------------------
      # 10. Build Android TV APK
      # ------------------------------------------------------------
      - name: Build Android TV APK
        working-directory: android
        shell: bash
        run: |
          set -e

          chmod +x ./gradlew

          echo "Gradle version:"
          ./gradlew --version

          echo ""
          echo "Starting Android TV APK build..."

          ./gradlew assembleDebug --stacktrace


      # ------------------------------------------------------------
      # 11. Find APK
      # ------------------------------------------------------------
      - name: Find generated APK
        shell: bash
        run: |
          echo "Searching for generated APK files..."

          find android -type f -name "*.apk" -print

          APK_COUNT=$(find android -type f -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No APK was generated."
            exit 1
          fi

          echo ""
          echo "APK generated successfully."


      # ------------------------------------------------------------
      # 12. Upload APK
      # ------------------------------------------------------------
      - name: Upload Android TV APK
        uses: actions/upload-artifact@v4
        with:
          name: Kinoma-Android-TV-APK
          path: android/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
