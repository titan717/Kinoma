<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <title>Kinoma</title>
    <meta name="description" content="Kinoma — a cinematic streaming platform for anime, movies, and series." />
    <meta property="og:title" content="Kinoma" />
    <meta property="og:description" content="A cinematic streaming platform for anime, movies, and series." />
    <meta property="og:type" content="website" />

    <meta name="theme-color" content="#0f0d0d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kinoma" />

    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <script>
      (function () {
        try {
          var ua = (navigator.userAgent || '').toLowerCase();
          if (ua.indexOf('kinomatv') !== -1 || window.KinomaNative) {
            window.isKinomaAndroidTV = true;
            localStorage.setItem('kinoma_tv_mode', 'true');
            document.documentElement.classList.add('tv-mode');
          }
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
