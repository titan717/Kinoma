<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0f16"/>
      <stop offset="50%" stop-color="#141522"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </linearGradient>
    <linearGradient id="purpleRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e879f9"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Rounded App Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Outer Glow Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#purpleRing)" stroke-width="12" opacity="0.3" filter="url(#glow)"/>
  
  <!-- Main Brand Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#purpleRing)" stroke-width="18" stroke-linecap="round" stroke-dasharray="800 200"/>

  <!-- Stylized Geometric "K" Icon -->
  <g transform="translate(176, 156)" fill="white">
    <!-- Left Vertical Pillar -->
    <rect x="0" y="0" width="36" height="200" rx="18" fill="url(#purpleRing)"/>
    
    <!-- Upper Diagonal Arm -->
    <path d="M 28 115 L 120 22 C 127 15 138 15 145 22 C 152 29 152 40 145 47 L 68 125 Z" fill="white"/>
    
    <!-- Lower Diagonal Leg -->
    <path d="M 45 105 L 142 188 C 150 195 150 206 142 213 C 135 220 124 220 117 213 L 24 135 Z" fill="url(#accentGlow)"/>

    <!-- Small Golden Anime Star Accent -->
    <polygon points="120,70 124,80 134,82 126,90 128,100 120,94 112,100 114,90 106,82 116,80" fill="#facc15"/>
  </g>

  <!-- Subtle Android TV Badge Pill at Bottom Center -->
  <rect x="186" y="415" width="140" height="34" rx="17" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  <text x="256" y="437" text-anchor="middle" fill="#c084fc" font-family="system-ui, sans-serif" font-size="14" font-weight="800" letter-spacing="2">KINOMA</text>
</svg>
